<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cap Web</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <h1>Cap Web</h1>
    <p>Un assistant pour les adhérents du club : il recommande des séances selon chaque personne.</p>
    <ul id="messages"></ul>
    <form id="chat-form">
      <label for="message">Votre message</label>
      <textarea id="message" name="message" maxlength="320" rows="3"></textarea>
      <button type="submit">Envoyer</button>
    </form>
    <ul id="suggestions">
      <li><button type="button">Quelle séance me conseilles-tu pour mon niveau ?</button></li>
      <li><button type="button">Quelles séances sont prévues cette semaine ?</button></li>
      <li><button type="button">Comment m'échauffer avant une séance ?</button></li>
    </ul>
    <p id="status" role="status"></p>
  </main>
  <script src="./js/app.js"></script>
</body>
</html>
